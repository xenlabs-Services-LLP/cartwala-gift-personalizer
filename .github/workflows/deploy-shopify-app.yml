name: Deploy Shopify app

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: shopify-app-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck app
        run: npm run typecheck

      - name: Run personalizer QA
        run: npm run qa

      - name: Install latest Shopify CLI
        run: npm install -g @shopify/cli@latest

      - name: Verify this is still the latest master commit
        id: latest
        shell: bash
        run: |
          git fetch origin master
          LATEST_SHA="$(git rev-parse origin/master)"
          echo "latest_sha=$LATEST_SHA" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_SHA" != "$LATEST_SHA" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Skipping stale deploy: $GITHUB_SHA is no longer latest master ($LATEST_SHA)."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Deploying latest master commit: $GITHUB_SHA"
          fi

      - name: Deploy app configuration and extensions
        if: steps.latest.outputs.skip == 'false'
        env:
          SHOPIFY_APP_AUTOMATION_TOKEN: ${{ secrets.SHOPIFY_APP_AUTOMATION_TOKEN }}
          SHOPIFY_FLAG_CLIENT_ID: 'ce0ab02aa2c699519934f02e1811a8f2'
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
        run: shopify app deploy --client-id ce0ab02aa2c699519934f02e1811a8f2 --allow-updates --source-control-url "$COMMIT_URL"
