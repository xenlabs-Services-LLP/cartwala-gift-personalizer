name: Deploy Shopify app

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: shopify-app-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run personalizer QA
        run: npm run qa

      - name: Install latest Shopify CLI
        run: npm install -g @shopify/cli@latest

      - name: Deploy app configuration and extensions
        env:
          SHOPIFY_APP_AUTOMATION_TOKEN: ${{ secrets.SHOPIFY_APP_AUTOMATION_TOKEN }}
        run: shopify app deploy --allow-updates
