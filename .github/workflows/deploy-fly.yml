name: Deploy Fly backend

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-fly-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Ensure public IPs
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -e
          IPS="$(flyctl ips list -a cartwala-gift-personalizer 2>/dev/null || true)"
          echo "$IPS"
          if ! echo "$IPS" | grep -qE 'v6|IPv6'; then
            flyctl ips allocate-v6 -a cartwala-gift-personalizer
          fi
          IPS="$(flyctl ips list -a cartwala-gift-personalizer 2>/dev/null || true)"
          if ! echo "$IPS" | grep -qE 'v4|IPv4'; then
            flyctl ips allocate-v4 --shared -a cartwala-gift-personalizer
          fi

      - name: Deploy backend
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only -a cartwala-gift-personalizer
