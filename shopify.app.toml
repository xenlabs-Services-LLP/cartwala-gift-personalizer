# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "ce0ab02aa2c699519934f02e1811a8f2"
name = "Cartwala Gift Personalizer"
application_url = "https://cartwala-gift-personalizer.fly.dev"
embedded = true

[build]
automatically_update_urls_on_dev = true
include_config_on_deploy = true

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

[access_scopes]
scopes = "read_files,read_orders,read_products,write_files,write_products"

[auth]
redirect_urls = [ "https://cartwala-gift-personalizer.fly.dev/auth/callback" ]

[pos]
embedded = false
